[package]
name = "mcp-bridge"
version = "0.3.0"
edition = "2021"
description = "Secure, configurable MCP gateway for local automation"
license = "MIT"
repository = "https://github.com/shyne-05/opencode-mcp-bridge"
keywords = ["mcp", "bridge", "automation"]
readme = "README.md"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing-subscriber = "0.3"
urlencoding = "2"
base64 = "0.22"
getrandom = "0.3"
sha2 = "0.10"
