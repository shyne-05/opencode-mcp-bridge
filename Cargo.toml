[package]
name = "opencode-mcp-bridge"
version = "0.2.3"
edition = "2021"
description = "Rust MCP bridge for OpenCode/Codex with host shell and Chrome CDP, per-user token/domain isolation"
license = "MIT"
repository = "https://github.com/shyne-05/opencode-mcp-bridge"
keywords = ["mcp", "opencode", "codex", "chatgpt", "claude"]
readme = "README.md"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing-subscriber = "0.3"
urlencoding = "2"
