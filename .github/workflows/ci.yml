name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - name: Rust tests on Unix
        if: runner.os != 'Windows'
        run: cargo test --locked --all-features
      - name: Rust tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo test --locked --all-features -- --test-threads=1
      - name: Windows PowerShell shell regressions
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MCP_WINDOWS_SHELL: powershell
        run: |
          cargo test --locked --all-features --bin mcp-bridge process::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell process regressions failed' }
          cargo test --locked --all-features --test regressions shell_failures_are_tool_errors -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell timeout regression failed' }
      - name: Native macOS helper regressions
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/bash -n scripts/install-user-service-macos.sh
          /bin/bash -n scripts/start-browser.sh
          /bin/bash -n scripts/bootstrap-oauth.sh
          /bin/bash -n scripts/run-with-env.sh
          /bin/bash tests/install_user_service_macos.sh
          /bin/bash tests/start_browser.sh
          /bin/bash tests/bootstrap_oauth.sh
          /bin/bash tests/run_with_env.sh
          /bin/bash tests/scan_secrets.sh
      - name: Install Playwright package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --global playwright@1.62.1
      - name: Install Playwright package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          npm install --global playwright@1.62.1
      - name: Browser worker regression on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: NODE_PATH="$(npm root -g)" node tests/browser_worker.cjs
      - name: Browser worker regression on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NODE_PATH = (npm root -g)
          node tests/browser_worker.cjs
      - name: OAuth browser regression on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: NODE_PATH="$(npm root -g)" node tests/oauth_browser.cjs
      - name: OAuth browser regression on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NODE_PATH = (npm root -g)
          node tests/oauth_browser.cjs
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: node --check scripts/browser.cjs
      - run: node --check tests/browser_worker.cjs
      - run: node --check tests/oauth_browser.cjs
      - name: Package release on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/package-release.sh
      - name: Package release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-release.ps1

  linux-security-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash -n scripts/scan-secrets.sh
      - run: bash -n tests/scan_secrets.sh
      - run: bash tests/scan_secrets.sh
      - run: bash scripts/scan-secrets.sh --worktree
      - run: bash scripts/scan-secrets.sh
      - run: bash -n scripts/package-release.sh
      - run: bash -n scripts/deploy-user-service.sh
      - run: bash -n scripts/bootstrap-oauth.sh
      - run: bash -n scripts/run-with-env.sh
      - run: bash -n scripts/start-browser.sh
      - run: bash -n scripts/install-user-service-macos.sh
      - run: bash tests/run_with_env.sh
      - run: bash tests/install_user_service_macos.sh
      - run: bash tests/bootstrap_oauth.sh
      - run: bash tests/start_browser.sh

  windows-script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse helpers with PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'scripts/package-release.ps1',
            'scripts/bootstrap-oauth.ps1',
            'scripts/run-with-env.ps1',
            'scripts/start-browser.ps1',
            'scripts/install-user-service-windows.ps1',
            'tests/windows_helpers.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Parse helpers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'scripts/package-release.ps1',
            'scripts/bootstrap-oauth.ps1',
            'scripts/run-with-env.ps1',
            'scripts/start-browser.ps1',
            'scripts/install-user-service-windows.ps1',
            'tests/windows_helpers.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify Windows PowerShell and CMD availability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ps = & powershell.exe -NoLogo -NoProfile -NonInteractive -Command "Write-Output MCP_PS_OK"
          if (($ps | Out-String).Trim() -ne 'MCP_PS_OK') { throw 'Windows PowerShell invocation failed' }
          $cmd = & cmd.exe /d /s /c "echo MCP_CMD_OK"
          if (($cmd | Out-String).Trim() -ne 'MCP_CMD_OK') { throw 'CMD invocation failed' }
      - name: Windows helper regressions on PowerShell 5.1
        shell: powershell
        run: .\tests\windows_helpers.ps1
      - name: Windows helper regressions on PowerShell 7
        shell: pwsh
        run: .\tests\windows_helpers.ps1

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          createIssues: false
