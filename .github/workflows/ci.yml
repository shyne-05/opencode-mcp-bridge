name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo test --locked --all-features
      - name: Install Playwright package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --global playwright@1.62.1
      - name: Install Playwright package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='1'
          npm install --global playwright@1.62.1
      - name: Browser worker regression on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: NODE_PATH="$(npm root -g)" node tests/browser_worker.cjs
      - name: Browser worker regression on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NODE_PATH = (npm root -g)
          node tests/browser_worker.cjs
      - name: OAuth browser regression on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: NODE_PATH="$(npm root -g)" node tests/oauth_browser.cjs
      - name: OAuth browser regression on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NODE_PATH = (npm root -g)
          node tests/oauth_browser.cjs
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: node --check scripts/browser.cjs
      - run: node --check tests/browser_worker.cjs
      - run: node --check tests/oauth_browser.cjs
      - name: Package release on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/package-release.sh
      - name: Package release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-release.ps1

  linux-security-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bash -n scripts/scan-secrets.sh
      - run: bash scripts/scan-secrets.sh
      - run: bash -n scripts/package-release.sh
      - run: bash -n scripts/deploy-user-service.sh
      - run: bash -n scripts/bootstrap-oauth.sh
      - run: bash -n scripts/run-with-env.sh
      - run: bash -n scripts/start-browser.sh
      - run: bash -n scripts/install-user-service-macos.sh
      - name: Verify OAuth bootstrap helper
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          log_file="$(mktemp)"
          HOME="$test_home" bash scripts/bootstrap-oauth.sh http://127.0.0.1:3000 >"$log_file"
          env_file="$test_home/.config/mcp-bridge/env"
          test "$(stat -c '%a' "$env_file")" = "600"
          grep -qx 'MCP_OAUTH_USERNAME=admin' "$env_file"
          grep -qx 'MCP_OAUTH_ALLOW_INSECURE_HTTP=true' "$env_file"
          first_password="$(sed -n 's/^MCP_OAUTH_PASSWORD=//p' "$env_file")"
          test "${#first_password}" -ge 24
          if grep -Fq "$first_password" "$log_file"; then
            echo 'bootstrap password leaked to normal output' >&2
            exit 1
          fi
          HOME="$test_home" bash scripts/bootstrap-oauth.sh http://127.0.0.1:3000 >"$log_file"
          second_password="$(sed -n 's/^MCP_OAUTH_PASSWORD=//p' "$env_file")"
          test "$first_password" = "$second_password"
          HOME="$test_home" bash scripts/bootstrap-oauth.sh --rotate http://127.0.0.1:3000 >"$log_file"
          rotated_password="$(sed -n 's/^MCP_OAUTH_PASSWORD=//p' "$env_file")"
          test "$first_password" != "$rotated_password"
          if grep -Fq "$rotated_password" "$log_file"; then
            echo 'rotated password leaked to normal output' >&2
            exit 1
          fi

  windows-script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'scripts/package-release.ps1',
            'scripts/bootstrap-oauth.ps1',
            'scripts/run-with-env.ps1',
            'scripts/start-browser.ps1',
            'scripts/install-user-service-windows.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify Windows OAuth bootstrap helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'mcp-oauth-test'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $env:MCP_BRIDGE_ENV_FILE = Join-Path $root 'env'
          $log = Join-Path $root 'bootstrap.log'
          .\scripts\bootstrap-oauth.ps1 'http://127.0.0.1:3000' *> $log
          $first = (Get-Content $env:MCP_BRIDGE_ENV_FILE | Where-Object { $_ -like 'MCP_OAUTH_PASSWORD=*' } | Select-Object -Last 1).Substring('MCP_OAUTH_PASSWORD='.Length)
          if ($first.Length -lt 24) { throw 'generated password is too short' }
          if ((Get-Content $log -Raw).Contains($first)) { throw 'bootstrap password leaked to normal output' }
          .\scripts\bootstrap-oauth.ps1 'http://127.0.0.1:3000' *> $log
          $second = (Get-Content $env:MCP_BRIDGE_ENV_FILE | Where-Object { $_ -like 'MCP_OAUTH_PASSWORD=*' } | Select-Object -Last 1).Substring('MCP_OAUTH_PASSWORD='.Length)
          if ($first -ne $second) { throw 'normal bootstrap unexpectedly rotated password' }
          .\scripts\bootstrap-oauth.ps1 -Rotate 'http://127.0.0.1:3000' *> $log
          $rotated = (Get-Content $env:MCP_BRIDGE_ENV_FILE | Where-Object { $_ -like 'MCP_OAUTH_PASSWORD=*' } | Select-Object -Last 1).Substring('MCP_OAUTH_PASSWORD='.Length)
          if ($first -eq $rotated) { throw 'rotate did not change password' }
          if ((Get-Content $log -Raw).Contains($rotated)) { throw 'rotated password leaked to normal output' }

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        with:
          createIssues: false
