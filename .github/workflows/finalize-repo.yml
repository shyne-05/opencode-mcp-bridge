name: Finalize repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply safe OAuth onboarding defaults
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/config.rs",
              '.unwrap_or_else(|| "user".to_string()),',
              '.unwrap_or_else(|| "admin".to_string()),',
          )

          replace_once(
              "src/oauth/response.rs",
              '''pub(super) fn login_page(\n    request: &OAuthAuthorizeRequest,\n    client: &OAuthClient,\n    validated_redirect_uri: &str,\n    error: Option<&str>,\n) -> Response {''',
              '''pub(super) fn login_page(\n    request: &OAuthAuthorizeRequest,\n    client: &OAuthClient,\n    validated_redirect_uri: &str,\n    username: &str,\n    error: Option<&str>,\n) -> Response {''',
          )
          replace_once(
              "src/oauth/response.rs",
              '''<label>Username<br><input name=\\"username\\" autocomplete=\\"username\\" required></label>''',
              '''<label>Username<br><input name=\\"username\\" value=\\"{username}\\" autocomplete=\\"username\\" required></label>''',
          )
          replace_once(
              "src/oauth/response.rs",
              '''        client_name = html_escape(&client.client_name),\n        redirect_host = html_escape(&redirect_host),''',
              '''        client_name = html_escape(&client.client_name),\n        redirect_host = html_escape(&redirect_host),\n        username = html_escape(username),''',
          )

          replace_once(
              "src/oauth/mod.rs",
              '''        Ok(validated) => login_page(&request, &validated.client, &validated.redirect_uri, None),''',
              '''        Ok(validated) => login_page(\n            &request,\n            &validated.client,\n            &validated.redirect_uri,\n            &state.config.oauth.username,\n            None,\n        ),''',
          )
          replace_once(
              "src/oauth/mod.rs",
              '''        return login_page(\n            &form.request,\n            &validated.client,\n            &validated.redirect_uri,\n            Some("Invalid username or password."),\n        );''',
              '''        return login_page(\n            &form.request,\n            &validated.client,\n            &validated.redirect_uri,\n            &state.config.oauth.username,\n            Some("Invalid username or password."),\n        );''',
          )

          replace_once(
              "tests/oauth_browser.cjs",
              '''    await page.locator('input[name="username"]').fill(USERNAME);''',
              '''    assert(\n      (await page.locator('input[name="username"]').inputValue()) === USERNAME,\n      "OAuth login did not prefill the configured username",\n    );\n    await page.locator('input[name="username"]').fill(USERNAME);''',
          )

          readme = Path("README.md")
          text = readme.read_text()
          old = '''```bash\nexport MCP_PUBLIC_URL="https://your-domain.example.com"\nexport MCP_OAUTH_USERNAME="bridge-user"\nread -r -s -p "MCP OAuth password: " MCP_OAUTH_PASSWORD\nexport MCP_OAUTH_PASSWORD\nprintf '\\n'\n```\n\nThe OAuth password must be at least 12 characters.'''
          new = '''```bash\nbash scripts/bootstrap-oauth.sh https://your-domain.example.com\n```\n\nThe bootstrap helper uses `admin` as the normal username, generates a unique high-entropy password locally, and stores it only in `~/.config/mcp-bridge/env` with mode `600`. No shared default password is committed to this repository. To view the local credential when the OAuth login page opens:\n\n```bash\nbash scripts/bootstrap-oauth.sh --show\n```\n\nUse `--rotate` to replace the password deliberately. See [`docs/OAUTH_SETUP.md`](docs/OAUTH_SETUP.md) for the complete onboarding and rotation workflow. You can still set `MCP_OAUTH_USERNAME` and `MCP_OAUTH_PASSWORD` manually; explicit values override the bootstrap convention, and passwords must be at least 12 characters.'''
          if text.count(old) != 1:
              raise SystemExit("README OAuth setup block did not match exactly once")
          text = text.replace(old, new, 1)
          old_row = '| `MCP_OAUTH_USERNAME` | `user` | Built-in OAuth login username |'
          new_row = '| `MCP_OAUTH_USERNAME` | `admin` | Built-in OAuth login username; bootstrap helper writes this explicitly |'
          if text.count(old_row) != 1:
              raise SystemExit("README OAuth username row did not match exactly once")
          readme.write_text(text.replace(old_row, new_row, 1))
          PY

      - name: Verify changes
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo test --locked --all-features
          node --check tests/oauth_browser.cjs
          bash -n scripts/bootstrap-oauth.sh
          bash -n scripts/scan-secrets.sh
          git diff --check

      - name: Commit safe onboarding update
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/config.rs src/oauth/mod.rs src/oauth/response.rs tests/oauth_browser.cjs
          git commit -m "feat: make OAuth onboarding safe and predictable"
          git push origin HEAD:main

      - name: Delete merged realtime branch
        run: |
          set -euo pipefail
          expected="a01eb59bd76e07450c06067dd55a6a82984099af"
          actual="$(git ls-remote origin refs/heads/realtime-v0.6 | cut -f1)"
          if [[ -z "$actual" ]]; then
            echo "realtime-v0.6 is already absent"
            exit 0
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "refusing to delete realtime-v0.6 because its head moved: $actual" >&2
            exit 1
          fi
          git push origin --delete realtime-v0.6
