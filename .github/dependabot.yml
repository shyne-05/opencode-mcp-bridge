version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Routine version-update PRs stay patch-only. Minor/major dependency
    # migrations are deliberate maintenance work with full regression testing.
    # Dependabot security updates are not restricted by allow.update-types.
    allow:
      - dependency-type: direct
        update-types:
          - version-update:semver-patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node runtime major upgrades are deliberate compatibility work.
      - dependency-name: node
        update-types:
          - version-update:semver-major
      # The builder intentionally tracks the project's declared Rust MSRV.
      - dependency-name: rust
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
